name: Bug report
description: Something in the task board does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, do not file it here. Follow https://github.com/EranTzabar/TaskManagments/blob/main/SECURITY.md
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an admin or a viewer
        2. Open the board, notes, or user page
        3. Do this
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Board and tasks
        - Subtasks
        - Archive
        - Custom columns
        - Import and export
        - Sticky notes
        - Users and permissions
        - Login and sessions
        - Something else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser or server output. Remove secrets, connection strings, cookies, and passwords first.
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, browser, and whether MongoDB is local or Atlas.
      placeholder: |
        - Node:
        - Browser:
        - MongoDB: local or Atlas
    validations:
      required: false
